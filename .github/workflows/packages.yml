name: Opt-in pinned package verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libmpfr6
      - name: Install stable Arturo
        uses: arturo-lang/setup-arturo@59c9867a8c8564f0ad1cd4d1960e9fddd623c5b7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          do: fetch
          from: stable
          mode: full
      - run: arturo --version
      - name: Verify package assertions
        shell: bash
        run: |
          set -o pipefail
          bun run smoke:packages --allow-network 2>&1 | tee package-evidence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence
          path: package-evidence.log
